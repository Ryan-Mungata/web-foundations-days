<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Character counter</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main>
      <header>
        <h1>Live Character Counter</h1>
        <button type="button" id="theme-toggle">Dark mode</button>
      </header>

      <section>
        <label for="note-text">Your note</label>
        <textarea id="note-text" rows="8" placeholder="Start typing your note here..."></textarea>

        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <button type="button" id="clear-btn">Clear</button>
      </section>
    </main>
  </body>
  
</html>
